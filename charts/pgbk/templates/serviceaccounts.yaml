{{- $root := . -}}
{{- $created := dict -}}
{{- range $name, $profile := .Values.profiles }}
{{- $profile = include "pgbk.profile" (dict "root" $root "profile" $profile) | fromYaml -}}
{{- if (dig "serviceAccounts" "create" false $profile) }}
{{- $purposes := dict "backup" $root.Release.Namespace "repository" $root.Release.Namespace -}}
{{- if and $profile.verification $profile.verification.enabled }}{{- $_ := set $purposes "verify" $profile.verification.namespace }}{{- end }}
{{- if and $profile.restore $profile.restore.enabled }}{{- $_ := set $purposes "restore" $profile.restore.namespace }}{{- end }}
{{- range $purpose, $namespace := $purposes }}
{{- $account := include "pgbk.account" (dict "root" $root "profile" $profile "name" $name "purpose" $purpose) -}}
{{- $key := printf "%s/%s" $namespace $account -}}
{{- if not (hasKey $created $key) }}
{{- $_ := set $created $key true }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pgbk.account" (dict "root" $root "profile" $profile "name" $name "purpose" $purpose) }}
  namespace: {{ $namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
