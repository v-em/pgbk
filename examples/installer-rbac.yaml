# Bootstrap by an administrator. Replace namespace and subject before applying.
# This example assumes all chart resources use the existing backups namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgbk-installer
  namespace: backups
rules:
  - apiGroups: [""]
    resources: [configmaps, serviceaccounts, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgbk-installer
  namespace: backups
subjects:
  - kind: User
    name: INSTALLER_IDENTITY
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pgbk-installer
  apiGroup: rbac.authorization.k8s.io
