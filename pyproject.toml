[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgbk"
version = "0.2.0"
description = "pgbk — PostgreSQL backups for Kubernetes"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.txt"]
dependencies = [
  "boto3==1.43.110", "psycopg[binary]==3.3.6", "jsonschema==4.26.0",
  "PyYAML==6.0.3", "pglast==8.5", "kubernetes==37.0.0"
]

[project.scripts]
pgbk = "pgbk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgbk = ["values.schema.json", "native-restore*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]

[dependency-groups]
dev = ["pytest==9.1.1"]
integration = ["moto[server]==5.1.11"]

[tool.uv]
constraint-dependencies = [
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.4",
  "aiohttp-retry==2.9.1",
  "aiosignal==1.4.0",
  "annotated-types==0.8.0",
  "attrs==26.1.0",
  "boto3==1.43.110",
  "botocore==1.43.110",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.2",
  "durationpy==0.11",
  "frozenlist==1.8.0",
  "idna==3.20",
  "jmespath==1.1.0",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "kubernetes==37.0.0",
  "multidict==6.9.1",
  "oauthlib==4.0.0",
  "pglast==8.5",
  "propcache==0.5.4",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "pydantic==2.14.0",
  "pydantic-core==2.50.0",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.3",
  "referencing==0.37.0",
  "requests==2.34.2",
  "requests-oauthlib==2.0.0",
  "rpds-py==2026.9.1",
  "s3transfer==0.19.2",
  "six==1.17.0",
  "typing-extensions==4.16.0",
