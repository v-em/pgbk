# Merge after two-sources.yaml; keeps the same profile identity and changes its mode.
profiles:
  managed-direct:
    serviceAccounts:
      create: false
      backup: existing-backup-worker
      repository: existing-repository-worker
    target: managed
    kind: logical
    storage: archive
    logical:
      databases:
      - managed_app
      format: directory
      jobs: 4
      compression:
        method: zstd
        level: 3
      transfer:
        mode: staged
      globals: disabled
    schedule:
      enabled: false
    execution:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: '2'
          memory: 2Gi
    scratch:
      type: pvc
      size: 100Gi
      storageClassName: REPLACE_WITH_STORAGE_CLASS
    retention:
      maxAgeDays: 30
      minSuccessfulBackups: 3
    verification:
      enabled: false
