name: development-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -fL https://github.com/astral-sh/uv/releases/download/0.9.5/uv-x86_64-unknown-linux-gnu.tar.gz -o /tmp/uv.tar.gz
          curl -fL https://github.com/astral-sh/uv/releases/download/0.9.5/uv-x86_64-unknown-linux-gnu.tar.gz.sha256 -o /tmp/uv.sha256
          echo "$(cut -d ' ' -f1 /tmp/uv.sha256)  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          echo /tmp/uv-x86_64-unknown-linux-gnu >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run --frozen pytest && uv run --frozen python scripts/check_docs.py
      - run: |
          curl -fL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          /tmp/linux-amd64/helm lint charts/pgbk -f examples/values.yaml
          /tmp/linux-amd64/helm template pgbk charts/pgbk -f examples/values.yaml > /tmp/chart.yaml
          uv build
  real-tools:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        major: [14, 15, 16, 17, 18]
        mode: [staged, direct, directory]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -fL https://github.com/astral-sh/uv/releases/download/0.9.5/uv-x86_64-unknown-linux-gnu.tar.gz -o /tmp/uv.tar.gz
          curl -fL https://github.com/astral-sh/uv/releases/download/0.9.5/uv-x86_64-unknown-linux-gnu.tar.gz.sha256 -o /tmp/uv.sha256
          echo "$(cut -d ' ' -f1 /tmp/uv.sha256)  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          echo /tmp/uv-x86_64-unknown-linux-gnu >> "$GITHUB_PATH"
      - run: |
          uv sync --frozen --group integration
          uv run --frozen --group integration moto_server -H 0.0.0.0 -p 19000 > /tmp/s3.log 2>&1 &
          uv run --frozen --group integration python tests/feasibility/bucket.py
          uv run --frozen --group integration python scripts/build_images.py --major ${{ matrix.major }}
          uv run --frozen --group integration python scripts/run_integration.py --major ${{ matrix.major }} --mode ${{ matrix.mode }}
