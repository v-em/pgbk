# Bootstrap by an administrator in an EXISTING namespace. Replace the subject.
# No ServiceAccount, Role/RoleBinding, Lease or Namespace management permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgbk-deployer
  namespace: backups
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgbk-deployer
  namespace: backups
subjects:
  - kind: User
    name: DEPLOYER_IDENTITY
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pgbk-deployer
  apiGroup: rbac.authorization.k8s.io
